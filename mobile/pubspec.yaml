name: sipdt_mobile
description: SIPDT Mobile - aplikasi pendataan offline-first Kabupaten Kepulauan Sangihe.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  uuid: ^4.6.0
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter

flutter:
  uses-material-design: true
