; Project PHP 8.5 configuration, loaded by php.cmd and inherited by child workers.
; SIPANDU_PHP_DIR is set by the launcher so extension paths remain portable.
extension_dir = "${SIPANDU_PHP_DIR}/ext"
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=pdo_sqlite
extension=sqlite3
extension=zip

date.timezone=Asia/Makassar
default_charset=UTF-8
memory_limit=512M
upload_max_filesize=64M
post_max_size=72M
upload_tmp_dir="${SIPANDU_STORAGE_DIR}/app/php-upload-tmp"
sys_temp_dir="${SIPANDU_STORAGE_DIR}/app/php-upload-tmp"
max_execution_time=120
max_input_vars=5000
error_reporting=E_ALL
display_errors=Off
log_errors=On
expose_php=Off

; Keep filesystem changes visible during development.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
opcache.jit_buffer_size=0
realpath_cache_size=4096K
realpath_cache_ttl=120

